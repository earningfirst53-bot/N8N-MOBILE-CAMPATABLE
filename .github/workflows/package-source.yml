name: Package NATEN source

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          git archive --format=zip --output=N8N-MOBILE-CAMPATABLE-main.zip HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: N8N-MOBILE-CAMPATABLE-source
          path: N8N-MOBILE-CAMPATABLE-main.zip
          if-no-files-found: error
