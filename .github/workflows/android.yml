name: Build NATEN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply startup crash hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path("app/src/main/java/com/naten/mobile/MainActivity.kt")
          text = main.read_text()
          old = "        nameView.text = state.name\n"
          if old in text:
              text = text.replace(old, "        // Legacy nameView is not part of the current editor hierarchy.\n")
          main.write_text(text)

          gradle = Path("app/build.gradle")
          g = gradle.read_text()
          g = g.replace("versionCode 8", "versionCode 9")
          g = g.replace("versionName '0.6.1'", "versionName '0.6.2'")
          gradle.write_text(g)
          PY

      - name: Persist startup crash hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/naten/mobile/MainActivity.kt app/build.gradle
          if ! git diff --cached --quiet; then
            git commit -m "Fix NATEN startup nameView crash [skip ci]"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NATEN-debug-apk-fixed-0.6.2
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
