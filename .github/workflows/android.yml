name: Build NATEN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply startup and editor polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path("app/src/main/java/com/naten/mobile/MainActivity.kt")
          text = main.read_text()
          text = text.replace('    private lateinit var nameView: TextView\n', '')
          text = text.replace('    private lateinit var editorFrame: FrameLayout\n', '    private lateinit var editorFrame: FrameLayout\n    private lateinit var breadcrumbView: TextView\n')
          text = text.replace('        topbar.addView(breadcrumb, LinearLayout.LayoutParams(0, -1, 1f))', '        breadcrumbView = breadcrumb\n        topbar.addView(breadcrumb, LinearLayout.LayoutParams(0, -1, 1f))')
          old_more = '''        val more = n8nChromeButton("⋯")\n        more.setOnClickListener { showMoreMenu() }'''
          new_more = '''        val command = n8nChromeButton("⌘")\n        command.contentDescription = "Command center"\n        command.setOnClickListener { showCommandCenter() }\n        topbar.addView(command, LinearLayout.LayoutParams(dp(40), dp(34)).apply {\n            marginStart = dp(5)\n        })\n\n        val more = n8nChromeButton("⋯")\n        more.setOnClickListener { showMoreMenu() }'''
          text = text.replace(old_more, new_more)
          marker = '''    private fun showStartupRecovery(error: Throwable) {'''
          lifecycle = '''    override fun onPause() {\n        runCatching { WorkflowStore.save(this, state) }\n        super.onPause()\n    }\n\n    override fun onBackPressed() {\n        if (nodePanel != null) {\n            nodePanel?.let { editorFrame.removeView(it) }\n            nodePanel = null\n            return\n        }\n        super.onBackPressed()\n    }\n\n'''
          if lifecycle not in text:
              text = text.replace(marker, lifecycle + marker, 1)
          anchor = '''    private fun showMoreMenu() {'''
          command_method = '''    private fun showCommandCenter() {\n        val items = arrayOf("Add node", "Execute workflow", "Save workflow", "Open workflows", "Executions", "Credentials", "Automation status", "Import workflow JSON", "Export n8n JSON", "Rename workflow")\n        AlertDialog.Builder(this).setTitle("Command center").setItems(items) { _, which ->\n            when (which) {\n                0 -> showNodeLibrary(); 1 -> runWorkflow();\n                2 -> { WorkflowStore.save(this, state); syncAutomation(); setStatus("Saved", "Workflow saved on this device.") }\n                3 -> showWorkflows(); 4 -> showHistory(); 5 -> showCredentials(); 6 -> showAutomationStatus();\n                7 -> importJson(); 8 -> exportJson(true); 9 -> renameWorkflow()\n            }\n        }.setNegativeButton("Close", null).show()\n    }\n\n'''
          if "private fun showCommandCenter()" not in text:
              text = text.replace(anchor, command_method + anchor, 1)
          refresh_marker = '''    private fun refreshUi() {'''
          refresh_code = '''    private fun refreshUi() {\n        if (::breadcrumbView.isInitialized) {\n            breadcrumbView.text = "Personal  /  " + state.name\n        }'''
          if refresh_marker in text and 'breadcrumbView.text = "Personal  /  " + state.name' not in text:
              text = text.replace(refresh_marker, refresh_code, 1)
          old_share = '''        startActivity(Intent.createChooser(intent, "Share workflow"))'''
          new_share = '''        runCatching {\n            startActivity(Intent.createChooser(intent, "Share workflow"))\n        }.onFailure {\n            Toast.makeText(this, "No app is available to share this workflow.", Toast.LENGTH_LONG).show()\n        }'''
          if old_share in text:
              text = text.replace(old_share, new_share, 1)

          # Fix the white-input/white-text bug visible in the node editor dialog.
          text = text.replace('setTextColor(Color.rgb(92, 98, 108))\n                setPadding(0, dp(8), 0, dp(2))', 'setTextColor(Color.rgb(215, 218, 224))\n                setPadding(0, dp(8), 0, dp(2))', 1)
          text = text.replace('textSize = 14f\n            setPadding(dp(10), dp(7), dp(10), dp(7))\n            background = rounded(Color.WHITE, 10f, Color.rgb(209, 214, 222), 1)', 'textSize = 14f\n                setTextColor(Color.rgb(28, 31, 36))\n                setHintTextColor(Color.rgb(125, 130, 138))\n                setPadding(dp(10), dp(7), dp(10), dp(7))\n                background = rounded(Color.WHITE, 10f, Color.rgb(209, 214, 222), 1)', 1)
          text = text.replace('hint = "Node name"\n            setText(node.title)\n            textSize = 14f', 'hint = "Node name"\n            setText(node.title)\n            textSize = 14f\n            setTextColor(Color.rgb(28, 31, 36))\n            setHintTextColor(Color.rgb(125, 130, 138))', 1)

          # Make connection ports easier to hit on a phone without enlarging the visible dots.
          text = text.replace('distance(x, y, it.x, it.y + nodeH / 2f) <= dpF(24f)', 'distance(x, y, it.x, it.y + nodeH / 2f) <= dpF(30f)', 1)
          text = text.replace('return distance(x, y, hx, hy) <= dpF(18f)', 'return distance(x, y, hx, hy) <= dpF(24f)', 1)
          main.write_text(text)
          gradle = Path("app/build.gradle")
          g = gradle.read_text().replace("versionCode 10", "versionCode 11").replace("versionName '0.6.3'", "versionName '0.6.4'")
          gradle.write_text(g)
          PY

      - name: Persist editor polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/naten/mobile/MainActivity.kt app/build.gradle
          if ! git diff --cached --quiet; then
            git commit -m "Improve node editor readability and connection targeting [skip ci]"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NATEN-debug-apk-polished-0.6.4
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
