name: Build NATEN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NATEN-debug-apk-0.6.5
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Package complete source repository
        run: git archive --format=zip --output=N8N-MOBILE-CAMPATABLE-main.zip HEAD

      - name: Upload complete source repository
        uses: actions/upload-artifact@v4
        with:
          name: N8N-MOBILE-CAMPATABLE-source
          path: N8N-MOBILE-CAMPATABLE-main.zip
          if-no-files-found: error
