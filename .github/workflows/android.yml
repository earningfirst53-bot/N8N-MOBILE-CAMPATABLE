name: Build NATEN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply startup and editor polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path("app/src/main/java/com/naten/mobile/MainActivity.kt")
          text = main.read_text()

          # Remove the obsolete field that caused the startup crash in the old UI.
          text = text.replace('    private lateinit var nameView: TextView\n', '')

          # Keep the workflow breadcrumb synchronized after rename/switch/import.
          text = text.replace(
              '    private lateinit var editorFrame: FrameLayout\n',
              '    private lateinit var editorFrame: FrameLayout\n    private lateinit var breadcrumbView: TextView\n'
          )
          text = text.replace(
              '        val breadcrumb = TextView(this).apply {\n            text = "Personal  /  " + state.name',
              '        val breadcrumb = TextView(this).apply {\n            text = "Personal  /  " + state.name'
          )
          text = text.replace(
              '        topbar.addView(breadcrumb, LinearLayout.LayoutParams(0, -1, 1f))',
              '        breadcrumbView = breadcrumb\n        topbar.addView(breadcrumb, LinearLayout.LayoutParams(0, -1, 1f))'
          )

          # Add a compact command center beside Save, matching the command-bar idea in modern n8n.
          old_more = '''        val more = n8nChromeButton("⋯")\n        more.setOnClickListener { showMoreMenu() }'''
          new_more = '''        val command = n8nChromeButton("⌘")\n        command.contentDescription = "Command center"\n        command.setOnClickListener { showCommandCenter() }\n        topbar.addView(command, LinearLayout.LayoutParams(dp(40), dp(34)).apply {\n            marginStart = dp(5)\n        })\n\n        val more = n8nChromeButton("⋯")\n        more.setOnClickListener { showMoreMenu() }'''
          text = text.replace(old_more, new_more)

          # Replace placeholder undo/redo buttons with a clear, honest command-center action instead of fake behavior.
          text = text.replace(
              'val undo = canvasTool("↶") { Toast.makeText(this, "Undo is reserved for the next history layer.", Toast.LENGTH_SHORT).show() }',
              'val undo = canvasTool("↶") { showCommandCenter() }'
          )
          text = text.replace(
              'val redo = canvasTool("↷") { Toast.makeText(this, "Redo is reserved for the next history layer.", Toast.LENGTH_SHORT).show() }',
              'val redo = canvasTool("↷") { showCommandCenter() }'
          )

          # Add lifecycle persistence and a safer back behavior for side panels.
          marker = '''    private fun showStartupRecovery(error: Throwable) {'''
          lifecycle = '''    override fun onPause() {\n        runCatching { WorkflowStore.save(this, state) }\n        super.onPause()\n    }\n\n    override fun onBackPressed() {\n        if (nodePanel != null) {\n            nodePanel?.let { editorFrame.removeView(it) }\n            nodePanel = null\n            return\n        }\n        super.onBackPressed()\n    }\n\n'''
          text = text.replace(marker, lifecycle + marker, 1)

          # Command center: fast access to the actions a workflow builder uses most.
          anchor = '''    private fun showMoreMenu() {'''
          command_method = '''    private fun showCommandCenter() {\n        val items = arrayOf(\n            "Add node",\n            "Execute workflow",\n            "Save workflow",\n            "Open workflows",\n            "Executions",\n            "Credentials",\n            "Automation status",\n            "Import workflow JSON",\n            "Export n8n JSON",\n            "Rename workflow"\n        )\n\n        AlertDialog.Builder(this)\n            .setTitle("Command center")\n            .setItems(items) { _, which ->\n                when (which) {\n                    0 -> showNodeLibrary()\n                    1 -> runWorkflow()\n                    2 -> {\n                        WorkflowStore.save(this, state)\n                        syncAutomation()\n                        setStatus("Saved", "Workflow saved on this device.")\n                    }\n                    3 -> showWorkflows()\n                    4 -> showHistory()\n                    5 -> showCredentials()\n                    6 -> showAutomationStatus()\n                    7 -> importJson()\n                    8 -> exportJson(true)\n                    9 -> renameWorkflow()\n                }\n            }\n            .setNegativeButton("Close", null)\n            .show()\n    }\n\n'''
          text = text.replace(anchor, command_method + anchor, 1)

          # Keep breadcrumb current whenever the editor state is refreshed.
          refresh_marker = '''    private fun refreshUi() {'''
          text = text.replace(
              refresh_marker,
              refresh_marker + '''\n        if (::breadcrumbView.isInitialized) {\n            breadcrumbView.text = "Personal  /  " + state.name\n        }''',
              1
          )

          # Make sharing resilient when Android has no compatible share target.
          old_share = '''        startActivity(Intent.createChooser(intent, "Share workflow"))'''
          new_share = '''        runCatching {\n            startActivity(Intent.createChooser(intent, "Share workflow"))\n        }.onFailure {\n            Toast.makeText(this, "No app is available to share this workflow.", Toast.LENGTH_LONG).show()\n        }'''
          text = text.replace(old_share, new_share, 1)

          # Safer document export: report write failures rather than crashing the editor.
          old_export = '''            contentResolver.openOutputStream(uri)?.use { output ->\n                OutputStreamWriter(output, Charsets.UTF_8).use { writer -> writer.write(value) }\n            }\n            setStatus("Exported", "Workflow JSON written.")'''
          new_export = '''            runCatching {\n                contentResolver.openOutputStream(uri)?.use { output ->\n                    OutputStreamWriter(output, Charsets.UTF_8).use { writer -> writer.write(value) }\n                } ?: error("Unable to open destination")\n                setStatus("Exported", "Workflow JSON written.")\n            }.onFailure {\n                setStatus("Export failed", it.message ?: "Unable to write workflow JSON")\n            }'''
          text = text.replace(old_export, new_export, 1)

          main.write_text(text)

          gradle = Path("app/build.gradle")
          g = gradle.read_text()
          g = g.replace("versionCode 9", "versionCode 10")
          g = g.replace("versionName '0.6.2'", "versionName '0.6.3'")
          gradle.write_text(g)
          PY

      - name: Persist editor polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/naten/mobile/MainActivity.kt app/build.gradle
          if ! git diff --cached --quiet; then
            git commit -m "Polish NATEN editor reliability and command center [skip ci]"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NATEN-debug-apk-polished-0.6.3
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
